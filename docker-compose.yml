version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: hcmlite-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hcm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hcm_password}
      POSTGRES_DB: ${POSTGRES_DB:-hcmlite}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hcm} -d ${POSTGRES_DB:-hcmlite}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
